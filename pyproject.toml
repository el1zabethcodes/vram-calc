[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vram-calc"
version = "0.1.0"
description = "Precise VRAM calculator for quantized GGUF models: weights, KV cache, runtime overhead. Generates ready-to-run llama.cpp and Ollama configs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "vram-calc contributors" }]
keywords = [
    "llm",
    "vram",
    "gpu",
    "gguf",
    "llama-cpp",
    "ollama",
    "quantization",
    "kv-cache",
    "local-llama",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
]
dependencies = ["rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/el1zabethcodes/vram-calc"
Issues = "https://github.com/el1zabethcodes/vram-calc/issues"

[project.scripts]
vram-calc = "vram_calc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
